name: Build Folio Reader for Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '*.cjs'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the Android project (Bubblewrap)
        run: |
          npm install --no-save --no-audit --no-fund @bubblewrap/core@1
          node generate-project.cjs
          echo "----- AndroidManifest.xml -----"
          cat project/app/src/main/AndroidManifest.xml

      - name: Build the app
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign the app
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "Using build tools: $BT"
          UNSIGNED="$(find project/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "Unsigned APK: $UNSIGNED"
          PW="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/signing.p12" -storetype PKCS12 -alias folio -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Folio Reader"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/signing.p12" --ks-type PKCS12 --ks-key-alias folio \
            --ks-pass "pass:$PW" --key-pass "pass:$PW" --out folio-reader.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs folio-reader.apk
          FP="$(keytool -list -v -keystore "$RUNNER_TEMP/signing.p12" -storetype PKCS12 -storepass "$PW" -alias folio | sed -n 's/^.*SHA256: *//p' | head -n 1)"
          echo "Signing fingerprint: $FP"
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Publish the app and its Digital Asset Links file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node update-assetlinks.cjs "$FINGERPRINT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/assetlinks.json folio-reader.apk
          git commit -m "Build Folio Reader for Android"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."

      - name: Keep a copy of the app with this run
        uses: actions/upload-artifact@v4
        with:
          name: folio-reader-apk
          path: folio-reader.apk
